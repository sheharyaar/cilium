# The default VPC's pool.
#
# Multi-pool IPAM requires a pool named "default": agents block on it before
# they will allocate for any untenanted pod, including kube-dns and the
# gateway. Its CIDR is deliberately disjoint from the tenants' shared
# 10.64.0.0/16 so that an address seen in a trace is unambiguous about which
# VPC it came from.
---
apiVersion: cilium.io/v2alpha1
kind: CiliumPodIPPool
metadata:
  name: default
spec:
  ipv4:
    cidrs:
      - 10.128.0.0/16
    maskSize: 27
